; PlatformIO 工程 —— ESP32-S3 BMS 显示固件 (v1.1.0)
; 由仓库 firmware/ (Arduino IDE sketch) 迁移而来。
;
; 迁移对应关系：
;   firmware/firmware.ino    -> src/main.cpp
;   firmware/build_opt.h     -> [env] build_flags（-DLV_CONF_INCLUDE_SIMPLE / -DLGFX_USE_LVGL）
;   firmware/lv_conf.h       -> include/lv_conf.h（配合 -DLV_CONF_INCLUDE_SIMPLE 被 LVGL 找到）
;   firmware/partitions.csv  -> board_build.partitions
;   Arduino IDE 库依赖       -> lib_deps（版本范围与 DEPENDENCIES.md 一致）

[platformio]
default_envs = esp32s3
; 项目路径含中文（bms蓝牙屏），Windows 上 ld 生成 firmware.map 会失败（Invalid argument）。
; 统一将构建目录放到 D:/pio_build/<项目名>/ 下（纯 ASCII 路径）；以后其他项目同样处理。
build_dir = D:/pio_build/ANT_BMS_Arduino_IDE

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; 构建前自动把 firmware/lv_conf.h 同步到 lvgl 库目录（防依赖缓存清理/重装后丢失）。
extra_scripts = scripts/ensure_lv_conf.py

; ---- Flash / 分区 / 文件系统 ----
; partitions.csv 共 4MB（3MB app + 1MB SPIFFS），必须与仓库 firmware/ 保持同步。
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
; 硬件 = ESP32-S3-N16R8（16MB Flash + 8MB Octal PSRAM）：
; qio_opi = Flash QIO + PSRAM OPI，配合 -DBOARD_HAS_PSRAM 启用 PSRAM。
; （动态 UI/自定义主题强制要求 PSRAM ≥1MB，未启用则只显示 Factory UI。）
board_build.arduino.memory_type = qio_opi
; 使 `pio run -t uploadfs` 可烧录 SPIFFS 镜像。
board_build.filesystem = spiffs

; ---- 编译宏（原 firmware/build_opt.h）----
; 注：lv_conf.h 已直接放入 lvgl 库目录（.pio/libdeps/esp32s3/lvgl/lv_conf.h），
;     经 lvgl 的 includeDir "." 与内部相对路径 "../../lv_conf.h" 自动找到，
;     因此不需要 -DLV_CONF_INCLUDE_SIMPLE（若恢复使用 include/lv_conf.h 则需加回）。
build_flags =
    -DLGFX_USE_LVGL
    ; N16R8：让 Arduino 核心初始化 8MB Octal PSRAM（esp32-hal-psram 由该宏启用）。
    -DBOARD_HAS_PSRAM
    ; ESP32-S3 默认 "USB CDC On Boot: Enabled"，Serial 走原生 USB。
    ; 若板子 Serial 走 UART 桥（GPIO43/44），删除或改为 0。
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- 依赖库（原 firmware/DEPENDENCIES.md）----
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.9

; ---- 串口监视器 ----
monitor_speed = 115200
