; PlatformIO 工程 —— ESP32-S3 BMS 显示固件 (v1.1.0)
; 由仓库 firmware/ (Arduino IDE sketch) 迁移而来。
;
; 迁移对应关系：
;   firmware/firmware.ino    -> src/main.cpp
;   firmware/build_opt.h     -> [env] build_flags（-DLGFX_USE_LVGL 等；-DLV_CONF_INCLUDE_SIMPLE
;                                因 lv_conf.h 已移入 lvgl 库目录而省略）
;   firmware/lv_conf.h       -> lvgl 库目录内 lv_conf.h（经 ensure_lv_conf.py 自动同步）
;   firmware/partitions.csv  -> board_build.partitions
;   Arduino IDE 库依赖       -> lib_deps（版本范围与 DEPENDENCIES.md 一致）
;
; env 命名规则：esp32s3-n<flash>r<psram>（按模组型号），例如：
;   esp32s3-n16r8 : 16MB Flash + 8MB Octal PSRAM（qio_opi）
;   esp32s3-n4r2  : 4MB  Flash + 2MB Quad  PSRAM（qio_qspi）
; 新硬件型号按同样规则添加 [env:esp32s3-<型号>] 段即可。

[platformio]
default_envs = esp32s3-n16r8
; 项目路径可能含中文，Windows 上 ld 生成 firmware.map 会失败（Invalid argument）。
; 统一将构建目录放到 D:/pio_build/<项目名>/ 下（纯 ASCII 路径）；以后其他项目同样处理。
; 每个 env 的产物在 build_dir/<env名>/ 下，互不干扰。
; 这个目录可以根据自己的情况调整，报错了不要骂街，我也被坑过。
build_dir = D:/pio_build/ANT_BMS_Arduino_IDE

; ==================== 所有 env 公共配置 ====================
[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; 构建前自动把 firmware/lv_conf.h 同步到 lvgl 库目录（防依赖缓存清理/重装后丢失）。
extra_scripts = scripts/ensure_lv_conf.py

; ---- 分区 / 文件系统 ----
; partitions.csv 共 4MB（3MB app + 1MB SPIFFS），与旧 firmware/ 一致。 
; flash_size 与 memory_type 按硬件型号在各自 [env:] 段覆盖。
board_build.partitions = partitions.csv
; 使 `pio run -t uploadfs` 可烧录 SPIFFS 镜像。
board_build.filesystem = spiffs

; ---- 编译宏（原 firmware/build_opt.h）----
; 注：lv_conf.h 已放入 lvgl 库目录（经 lvgl 的 includeDir "." 与内部 "../../lv_conf.h"
;     自动找到），因此不需要 -DLV_CONF_INCLUDE_SIMPLE。
build_flags =
    ; 让LovyanGFX使用外部lvgl，不加这个有时候会有bug。
    -DLGFX_USE_LVGL
    ; 让 Arduino 核心初始化 PSRAM（esp32-hal-psram 由该宏启用）。
    ; 动态 UI/自定义主题强制要求 PSRAM ≥1MB，未启用则只显示 Factory UI。
    -DBOARD_HAS_PSRAM
    ; ESP32-S3 默认 "USB CDC On Boot: Enabled"，Serial 走原生 USB。
    ; 若板子 Serial 走 UART 桥（GPIO43/44），删除或改为 0。
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- 依赖库（与原 firmware/DEPENDENCIES.md 一致）----
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.9

; ---- 串口监视器 ----
monitor_speed = 115200

; ==================== ESP32-S3-N16R8 ====================
; 16MB Flash + 8MB Octal PSRAM
[env:esp32s3-n16r8]
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; ==================== ESP32-S3-N4R2 ====================
; 4MB Flash + 2MB Quad PSRAM
[env:esp32s3-n4r2]
board_build.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
